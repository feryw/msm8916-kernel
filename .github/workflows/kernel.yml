name: Release deb packages kernel
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit or tag to build'
        required: true
        default: 'v6.12.41-wyref'
      arch:
        description: "Target architecture"
        required: true
        default: 'armv7'
        type: choice
        options:
          - armv8
          - armv7
      
jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get -y update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install apt-utils
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install libc6-dev make bzip2 libdpkg-perl patch perl xz-utils \
            gnupg fakeroot gcc gcc-9 gcc-10 gcc-12 gcc-arm-linux-gnueabihf gcc-9-arm-linux-gnueabihf \
            gcc-10-arm-linux-gnueabihf gcc-12-arm-linux-gnueabihf autoconf automake bison flex libtool libssl-dev \
            libssl-dev:armhf libelf-dev debhelper bc rsync kmod cpio wget patchutils lzop liblz4-tool git lsb-release \
            ccache build-essential
          sudo timedatectl set-timezone Asia/Jakarta
          sudo hostnamectl set-hostname wyref
            
      - name: Checkout HEAD Kernel Source
        uses: actions/checkout@v4

      - name: Backup files
        run: |
          mkdir -p "${RUNNER_TEMP}/backup"
          cp arch/arm/configs/uz801v3_defconfig "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/msm8916-yiming-uz801v3.dts "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/msm8916-ufi.dtsi "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/msm8916.dtsi "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/pm8916.dtsi "${RUNNER_TEMP}/backup"
    
      - name: Check out code at specified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"
        
      - name: Restore defconfig & DTS
        run: |       
          cp $RUNNER_TEMP/backup/*_defconfig arch/arm/configs/
          cp $RUNNER_TEMP/backup/*.dts* arch/arm/boot/dts/qcom
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C uptohigh
          git status
          git add .
          git status
          if ! git diff --cached --quiet; then
            git commit -m "sync HEAD defconfig & DTS"
          else
            echo "No changes to commit"
          fi

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-kernel-build-${{ inputs.arch }}
          restore-keys: |
            ${{ runner.os }}-kernel-build-${{ inputs.arch }}-

      - name: Build kernel
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          make LOCALVERSION= mrproper
          if [ "${{ inputs.arch }}" = "armv8" ]; then
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 60
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 70
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 80
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 90
            sudo update-alternatives --set gcc /usr/bin/gcc-12
            make CC='ccache gcc' LOCALVERSION= uz801v3_defconfig
            make CC='ccache gcc' LOCALVERSION= bindeb-pkg -j$(nproc)
          else
            sudo update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-9 60
            sudo update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-10 70
            sudo update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-11 80
            sudo update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-12 90
            sudo update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-12
            make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- LOCALVERSION= uz801v3_defconfig
            DEB_BUILD_OPTIONS=compress=gzip KBUILD_DEBARCH=armhf make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- CC='ccache arm-linux-gnueabihf-gcc' LOCALVERSION= \
            -j$(nproc) bindeb-pkg
          fi
          
      - name: Prepare artifacts
        run: mkdir artifacts && mv ../linux-*$(ls ../linux-image-* | cut -d'_' -f1|cut -d'-' -f3)* artifacts/ && cp scripts/mkbootimg_chrootfs.sh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: artifacts/*

  bootimg:
    name: Make boot images
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Prepare
        run: |
          sudo apt-get -y update
          sudo apt-get -y install qemu-user-static mkbootimg
          if [ -d "artifacts" ]; then
            echo "The artifact directory exists."
          else
            echo "Create artifacts dir exist."
            mkdir -p artifacts
          fi

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel
          path: artifacts

      - name: Build
        run: |
          chmod +x mkbootimg_chrootfs.sh
          sudo ./mkbootimg_chrootfs.sh ${{ inputs.arch }}

      - name: Generate release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(ls artifacts/linux-image-* | cut -d'_' -f1|cut -d'-' -f3)
          TAG_NAME=$(echo v$NAME-${{ inputs.arch }})
          git log -1 --format=%b > changes.txt
          gh release delete "$TAG_NAME" --yes || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.NAME }}
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          body_path: changes.txt
          files: artifacts/*
