name: Release kernel deb packages
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit or tag to build'
        required: true
      arch:
        description: "Target architecture"
        required: true
        default: 'armv7'
        type: choice
        options:
          - arm64
          - armv7
      
jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Prepare
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get -y update
          sudo apt-get -y install git lsb-release ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf bison flex build-essential libssl-dev:armhf libssl-dev:arm64 libelf-dev debhelper bc rsync kmod cpio wget patchutils xz-utils lzop liblz4-tool binfmt-support qemu-user-static mkbootimg libmpc-dev
          sudo timedatectl set-timezone Asia/Jakarta
          sudo hostnamectl set-hostname wyref

      - name: Checkout HEAD Kernel Source
        uses: actions/checkout@v4

      - name: Backup files
        run: |
          mkdir -p "${RUNNER_TEMP}/backup"
          cp arch/arm/configs/uz801v3_defconfig "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/msm8916-yiming-uz801v3.dts "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/msm8916-ufi.dtsi "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/msm8916.dtsi "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/pm8916.dtsi "${RUNNER_TEMP}/backup"
          
      - name: Clean all files
        run: |
          rm -rf * .[^.] .??*
    
      - name: Check out code at specified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Restore defconfig & DTS
        run: |
          cp $RUNNER_TEMP/backup/*_defconfig arch/arm/configs/
          cp $RUNNER_TEMP/backup/*.dts* arch/arm/boot/dts/qcom
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C uptohigh
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "sync HEAD defconfig & DTS"
          else
            echo "No changes to commit"
          fi

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-kernel-build-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-kernel-build-

      - name: Build
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          if [[ "${{ inputs.arch }}" == "arm64" ]]; then
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CC='ccache aarch64-linux-gnu-gcc'
            export ARCH=arm64
          else
            export CROSS_COMPILE=arm-linux-gnueabihf-
            export CC='ccache arm-linux-gnueabihf-gcc'
            export ARCH=arm
            export KBUILD_DEBARCH=armhf
          fi
          make mrproper uz801v3_defconfig
          make -j"$(nproc)" deb-pkg
          shopt -s nullglob
          files=(../*orig.tar.gz)
          if [ ${#files[@]} -gt 0 ]; then
            echo "Deleting ${#files[@]} file(s): ${files[*]}"
            rm "${files[@]}"
          else
            echo "No orig.tar.gz files found."
          fi
          shopt -u nullglob

      - name: Prepare artifacts
        run: mkdir artifacts && mv ../linux-*$(ls ../linux-image-* | cut -d'_' -f1|cut -d'-' -f3)* artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: artifacts/*
          
      - name: Prepare bootimg
        run: |
          mkdir artifacts

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel
          path: artifacts

      - name: Build
        run: |
          cd .github/scripts
          chmod +x ./mkbootimg_chrootfs.sh
          sudo ./mkbootimg_chrootfs.sh ${{ inputs.arch }}

      - name: Generate release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(ls artifacts/linux-image-* | cut -d'_' -f1|cut -d'-' -f3)
          TAG_NAME=$(echo v$NAME-${{ inputs.arch }})
          git log -1 --format=%b > changes.txt
          gh release delete "$TAG_NAME" --yes || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.NAME }}
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          body_path: changes.txt
          files: artifacts/*
