name: Release deb packages kernel
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit or tag to build'
        required: true
        default: 'v6.12.30-wyref'
      arch:
        description: "Target architecture"
        required: true
        default: 'armv7'
        type: choice
        options:
          - armv8
          - armv7
      
jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    container: 
      image: debian:bullseye
      options: --hostname uz801
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Install dependencies
        run: |
          apt-get -y update
          DEBIAN_FRONTEND=noninteractive apt-get -y install apt-utils
          DEBIAN_FRONTEND=noninteractive apt-get -y install libc6-dev make bzip2 libdpkg-perl patch perl tar xz-utils \
            gnupg gpgv fakeroot gcc-9-aarch64-linux-gnu gcc-9-arm-linux-gnueabihf autoconf automake bison flex libtool \
            libssl-dev libelf-dev debhelper bc rsync kmod cpio wget patchutils lzop liblz4-tool git lsb-release bash ccache
            
          ZONE="Asia/Jakarta"
          ZONEFILE="/usr/share/zoneinfo/$ZONE"
          CURRENT_ZONE=$(readlink -f /etc/localtime 2>/dev/null || echo "")

          if [ "$CURRENT_ZONE" = "$ZONEFILE" ]; then
            echo "[INFO] Timezone is already set to $ZONE"
          else
            echo "[INFO] Timezone will be set to $ZONE"
            if [ ! -e "$ZONEFILE" ]; then
              echo "[WARN] Zonefile $ZONEFILE not found, installing tzdata..."
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata
            fi
            if [ -e "$ZONEFILE" ]; then
              ln -sf "$ZONEFILE" /etc/localtime
              echo "$ZONE" > /etc/timezone
              if command -v dpkg-reconfigure >/dev/null 2>&1; then
                dpkg-reconfigure -f noninteractive tzdata
              else
                echo "[WARN] dpkg-reconfigure not available, skipping"
              fi
            else
              echo "[FATAL] Zonefile still not found after installing tzdata"
              exit 1
            fi
          fi

      - name: Checkout HEAD Kernel Source
        uses: actions/checkout@v4

      - name: Backup files
        run: |
          mkdir -p "${RUNNER_TEMP}/backup"
          cp arch/arm/configs/uz801v3_defconfig "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/msm8916-yiming-uz801v3.dts "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/msm8916-ufi.dtsi "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/msm8916.dtsi "${RUNNER_TEMP}/backup"
          cp arch/arm/boot/dts/qcom/pm8916.dtsi "${RUNNER_TEMP}/backup"
    
      - name: Check out code at specified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"
        
      - name: Restore defconfig & DTS
        run: |       
          cp $RUNNER_TEMP/backup/*_defconfig arch/arm/configs/
          cp $RUNNER_TEMP/backup/*.dts* arch/arm/boot/dts/qcom
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C uptohigh
          git status
          git add .
          git status
          if ! git diff --cached --quiet; then
            git commit -m "sync HEAD defconfig & DTS"
          else
            echo "No changes to commit"
          fi

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-kernel-build-${{ inputs.arch }}-

      - name: Prepare build variables
        id: vars
        run: |
          SARCH="${{ inputs.arch }}"
          if [ "$SARCH" = "armv8" ]; then
            echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_OUTPUT
            echo "CC='ccache aarch64-linux-gnu-gcc'" >> $GITHUB_OUTPUT
            echo "ARCH=arm64" >> $GITHUB_OUTPUT
            update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-9 90
            update-alternatives --set aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-9
          else
            echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> $GITHUB_OUTPUT
            echo "CC='ccache arm-linux-gnueabihf-gcc'" >> $GITHUB_OUTPUT
            echo "ARCH=arm" >> $GITHUB_OUTPUT
            echo "DISTRO_ARCH=armhf" >> $GITHUB_OUTPUT
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-9 90
            update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-9
          fi
          
      - name: Build kernel
        run: |
          export USE_CCACHE=1
          export PATH="/usr/lib/ccache:$PATH"
          export KBUILD_DEBARCH=amd64
          
          make LOCALVERSION= mrproper
          make ARCH=${{ steps.vars.outputs.ARCH }} \
            CROSS_COMPILE=${{ steps.vars.outputs.CROSS_COMPILE }} \
            uz801v3_defconfig
            
          make ARCH=${{ steps.vars.outputs.ARCH }} \
            CROSS_COMPILE=${{ steps.vars.outputs.CROSS_COMPILE }} \
            CC=${{ steps.vars.outputs.CC }} \
            -j"$(nproc)" deb-pkg
  
      - name: Prepare artifacts
        run: mkdir artifacts && mv ../linux-*$(ls ../linux-image-* | cut -d'_' -f1|cut -d'-' -f3)* artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: artifacts/*

  bootimg:
    permissions:
      contents: write
    name: Make boot images
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare
        run: |
          sudo apt-get -y update
          sudo apt-get -y install rsync qemu-user-static mkbootimg
          mkdir artifacts

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel
          path: artifacts

      - name: Build
        run: |
          cd .github/scripts
          chmod +x ./mkbootimg_chrootfs.sh
          sudo ./mkbootimg_chrootfs.sh ${{ inputs.arch }}

      - name: Generate release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(ls artifacts/linux-image-* | cut -d'_' -f1|cut -d'-' -f3)
          TAG_NAME=$(echo v$NAME-${{ inputs.arch }})
          git log -1 --format=%b > changes.txt
          gh release delete "$TAG_NAME" --yes || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.NAME }}
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          body_path: changes.txt
          files: artifacts/*
