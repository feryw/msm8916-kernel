name: Release kernel deb packages

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      patch_kernel:
        description: "Patch kernel to new version"
        required: false
        default: 'false'
        type: boolean
      kernel_version:
        description: "Select kernel version"
        required: true
        default: '38'
        type: string
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

jobs:
  build:
    name: Build kernel and boot image (${{ matrix.arch }})
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        arch: [arm64, armv7]

    steps:
      - name: Reset APT sources to archive.ubuntu.com
        run: |
          sudo sed -i 's|http://.*.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list
          sudo apt-get clean
          sudo apt-get update

      - name: Add architectures and update
        run: |
          sudo dpkg --add-architecture armhf
          sudo dpkg --add-architecture arm64
          sudo apt-get update

      - name: Install required packages
        run: |
          sudo apt-get install -y \
            git lsb-release \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            bison flex build-essential \
            libssl-dev:armhf libssl-dev:arm64 \
            libelf-dev debhelper bc rsync kmod cpio wget patchutils xz-utils \
            binfmt-support qemu-user-static mkbootimg

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Git safety
        run: git config --global --add safe.directory "$(pwd)"

      - name: Patch kernel to 6.12.${{ inputs.kernel_version }}
        if: inputs.patch_kernel == 'true'
        run: |
          set -e
          for i in $(seq 33 ${{ inputs.kernel_version }}); do
            fp=$((i-1))-$i
            wget -q "https://www.kernel.org/pub/linux/kernel/v6.x/incr/patch-6.12.$fp.xz"
            unxz patch-6.12.$fp.xz
            patch -p1 < patch-6.12.$fp
            rm patch-6.12.$fp
          done

      - name: SSH connection to Actions
        if: inputs.ssh == 'true'
        uses: csexton/debugger-action@master

      - name: Build kernel
        run: |
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            export ARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
          else
            export ARCH=arm
            export CROSS_COMPILE=arm-linux-gnueabihf-
            export KBUILD_DEBARCH=armhf
          fi

          export LOCALVERSION=
          make LOCALVERSION= mrproper
          if [ ! -f "arch/$ARCH/configs/uz801v3_defconfig" ]; then
            echo "Missing defconfig: arch/$ARCH/configs/uz801v3_defconfig"
            exit 1
          fi
          make uz801v3_defconfig
          make -j$(nproc) deb-pkg

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find .. -maxdepth 1 -name "linux-*.deb" -exec mv {} artifacts/ \;

      - name: Build boot image
        run: |
          cd .github/scripts
          chmod +x ./mkbootimg_chrootfs.sh
          sudo ./mkbootimg_chrootfs.sh ${{ matrix.arch }}

      - name: Generate release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          NAME=$(ls linux-image-* | cut -d'_' -f1 | cut -d'-' -f3)
          TAG_NAME="v$NAME-${{ matrix.arch }}"
          git log -1 --format=%b > ../changes.txt
          cd ..
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.NAME }}
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          body_path: changes.txt
          files: artifacts/*
