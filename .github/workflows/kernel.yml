name: Release kernel
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit or tag to build'
        required: true
      arch:
        description: "Target architecture"
        required: true
        default: 'armv7'
        type: choice
        options:
          - arm64
          - armv7

jobs:
  build:
    name: Build kernel and boot image
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install mkbootimg patchutils qemu-user-static git
          sudo timedatectl set-timezone Asia/Jakarta
          sudo hostnamectl set-hostname wyref

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-kernel-build-${{ inputs.arch }}-

      - name: Prepare build variables
        id: vars
        run: |
          ARCH="${{ inputs.arch }}"
          if [ "$ARCH" = "arm64" ]; then
            echo "DISTRO_ARCH=arm64" >> $GITHUB_OUTPUT
            echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_OUTPUT
            echo "KERNEL_ARCH=arm64" >> $GITHUB_OUTPUT
            echo "DTB_DIR=usr/lib/linux-image*/qcom" >> $GITHUB_OUTPUT
          else
            echo "DISTRO_ARCH=armhf" >> $GITHUB_OUTPUT
            echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> $GITHUB_OUTPUT
            echo "KERNEL_ARCH=arm" >> $GITHUB_OUTPUT
            echo "DTB_DIR=usr/lib" >> $GITHUB_OUTPUT
          fi

      - name: Download and extract rootfs
        run: |
          ROOTFS_DIR="rootfs-${{ inputs.arch }}"
          DOWNLOAD_SERVER="images.linuxcontainers.org"
          INDEX_PATH="/meta/1.0/index-system"
          DISTRO="ubuntu;jammy;${{ steps.vars.outputs.DISTRO_ARCH }};default"
          ROOTFS_URL="https://$DOWNLOAD_SERVER$(curl -fsSL https://$DOWNLOAD_SERVER$INDEX_PATH | grep "$DISTRO" | cut -f6 -d';')rootfs.tar.xz"
          mkdir -p "$ROOTFS_DIR"
          curl -L "$ROOTFS_URL" -o rootfs.tar.xz
          tar -xf rootfs.tar.xz -C "$ROOTFS_DIR"
          rm rootfs.tar.xz

      - name: Prepare chroot build script
        run: |
          cat <<EOF | sudo tee rootfs-${{ inputs.arch }}/tmp/chroot.sh > /dev/null
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          echo "nameserver 8.8.8.8" > /etc/resolv.conf
          apt-get update
          apt-get install -y git ccache build-essential bc kmod cpio flex libncurses5-dev libelf-dev \
            libssl-dev dwarves bison crossbuild-essential-${{ steps.vars.outputs.DISTRO_ARCH }} fakeroot debhelper rsync patchutils \
            xz-utils lzop liblz4-tool binfmt-support mkbootimg initramfs-tools wireless-regdb apt-utils

          cd /workspace

          # Clone and checkout the kernel source
          git clone https://github.com/${GITHUB_REPOSITORY}.git .
          git checkout ${{ github.event.inputs.commit }}

          # Restore specific files from HEAD of default branch
          DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
          git fetch origin "$DEFAULT_BRANCH"

          git show origin/$DEFAULT_BRANCH:arch/arm/configs/uz801v3_defconfig > arch/arm/configs/uz801v3_defconfig || true
          git show origin/$DEFAULT_BRANCH:arch/arm/boot/dts/qcom/msm8916-yiming-uz801v3.dts > arch/arm/boot/dts/qcom/msm8916-yiming-uz801v3.dts || true
          git show origin/$DEFAULT_BRANCH:arch/arm/boot/dts/qcom/msm8916-ufi.dtsi > arch/arm/boot/dts/qcom/msm8916-ufi.dtsi || true
          git show origin/$DEFAULT_BRANCH:arch/arm/boot/dts/qcom/msm8916.dtsi > arch/arm/boot/dts/qcom/msm8916.dtsi || true
          git show origin/$DEFAULT_BRANCH:arch/arm/boot/dts/qcom/pm8916.dtsi > arch/arm/boot/dts/qcom/pm8916.dtsi || true
          
          # Configure git user for auto commit (if needed)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit defconfig/DTS updates only if needed
          git switch -C uptohigh || git checkout -b uptohigh
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "sync HEAD defconfig & DTS"
          else
            echo "No changes to commit"
          fi

          make ARCH=${{ steps.vars.outputs.KERNEL_ARCH }} CROSS_COMPILE=${{ steps.vars.outputs.CROSS_COMPILE }} mrproper
          make ARCH=${{ steps.vars.outputs.KERNEL_ARCH }} CROSS_COMPILE=${{ steps.vars.outputs.CROSS_COMPILE }} uz801v3_defconfig
          fakeroot make -j\$(nproc) ARCH=${{ steps.vars.outputs.KERNEL_ARCH }} CROSS_COMPILE=${{ steps.vars.outputs.CROSS_COMPILE }} \
            CC="ccache ${CROSS_COMPILE}gcc" KBUILD_DEBARCH=${{ steps.vars.outputs.DISTRO_ARCH }} bindeb-pkg

          dpkg -i ../linux-image-*.deb || apt-get install -f -y
          EOF
          chmod +x rootfs-${{ inputs.arch }}/tmp/chroot.sh

      - name: Mount and enter chroot
        run: |
          ROOTFS="rootfs-${{ inputs.arch }}"
          mkdir -p "$ROOTFS/workspace"
          sudo mount --bind /proc "$ROOTFS/proc"
          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount --bind /dev/pts "$ROOTFS/dev/pts"
          sudo mount --bind /sys "$ROOTFS/sys"
          sudo cp /usr/bin/qemu-${{ inputs.arch == 'arm64' && 'aarch64' || 'arm' }}-static "$ROOTFS/usr/bin/"
          sudo chroot "$ROOTFS" /bin/bash /tmp/chroot.sh
          sudo umount "$ROOTFS/proc"
          sudo umount "$ROOTFS/dev/pts"
          sudo umount "$ROOTFS/dev"
          sudo umount "$ROOTFS/sys"

      - name: Extract and build boot.img
        run: |
          ROOTFS="rootfs-${{ inputs.arch }}"
          DTB_FILE="msm8916-yiming-uz801v3.dtb"
          RAMDISK_FILE="initrd.img"
          PARTUUID="a7ab80e8-e9d1-e8cd-f157-93f69b1d141e"
          DTB_PATH=$(find "$ROOTFS/${{ steps.vars.outputs.DTB_DIR }}" -name "*uz801v3.dtb" | head -n1)
          KERNEL_IMG=$(find "$ROOTFS/boot" -name "vmlinuz*" | head -n1)
          INITRD_IMG=$(find "$ROOTFS/boot" -name "initrd.img*" | head -n1)
          cp "$KERNEL_IMG" Image.gz
          cp "$INITRD_IMG" "$RAMDISK_FILE"
          cp "$DTB_PATH" "$DTB_FILE"

          if [ ! -f "$ROOTFS/boot/kernel-dtb" ]; then
            echo "kernel-dtb not found, generating manually..."
            cat "$KERNEL_IMG" "$DTB_FILE" > kernel-dtb
          else
            echo "Using prebuilt kernel-dtb from rootfs"
            cp "$ROOTFS/boot/kernel-dtb" .
          fi

          mkbootimg \
            --base 0x80000000 \
            --kernel_offset 0x00080000 \
            --ramdisk_offset 0x02000000 \
            --tags_offset 0x01e00000 \
            --pagesize 2048 \
            --second_offset 0x00f00000 \
            --ramdisk "$RAMDISK_FILE" \
            --cmdline "earlycon root=PARTUUID=$PARTUUID console=ttyMSM0,115200 no_framebuffer=true rw" \
            --kernel kernel-dtb -o boot.img

          mkdir -p artifacts
          REVISION=$(ls rootfs-${{ inputs.arch }}/workspace/../linux-image-* | cut -d'_' -f1 | cut -d'-' -f3 | head -n1)
          mv rootfs-${{ inputs.arch }}/workspace/../linux-*${REVISION}* artifacts/
          mv boot.img artifacts/boot-${{ inputs.arch }}.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: artifacts/*

      - name: Generate release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(ls artifacts/linux-image-* | cut -d'_' -f1|cut -d'-' -f3)
          TAG_NAME=$(echo v$NAME-${{ inputs.arch }})
          git log -1 --format=%b > changes.txt
          gh release delete "$TAG_NAME" --yes || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.NAME }}
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          body_path: changes.txt
          files: artifacts/*
