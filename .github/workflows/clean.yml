name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:  # Manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install GitHub CLI and jq
        run: |
          sudo apt update
          sudo apt install -y gh jq

      - name: Get current run ID
        id: current
        run: |
          CURRENT_RUN_ID=$(gh run view --json databaseId | jq -r '.databaseId')
          echo "current_run_id=$CURRENT_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Delete failed and cancelled runs
        run: |
          WORKFLOW_NAME="clean.yml"
          CURRENT_RUN_ID="${{ steps.current.outputs.current_run_id }}"
          echo "Current run ID: $CURRENT_RUN_ID"

          echo "Finding failed or cancelled runs for $WORKFLOW_NAME..."
          gh run list --workflow="$WORKFLOW_NAME" --limit 100 --json databaseId,status,conclusion \
            | jq -r --arg CURRENT "$CURRENT_RUN_ID" \
              '.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled")) | .databaseId' \
            | while read -r ID; do
                if [ "$ID" = "$CURRENT_RUN_ID" ]; then
                  echo "Skipping current run ID: $ID"
                  contin
