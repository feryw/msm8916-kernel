name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install GitHub CLI and jq
        run: |
          sudo apt update
          sudo apt install -y gh jq

      - name: Get all workflows in the repository
        run: |
          gh api repos/${{ github.repository }}/actions/workflows \
            | jq -r '.workflows[].name' > workflows.txt
          echo "Workflows found:"
          cat workflows.txt

      - name: Get currently running workflow run IDs
        run: |
          gh run list --repo "${{ github.repository }}" --limit 100 --json databaseId,status \
            | jq -r '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' > current_running.txt
          echo "Currently running run IDs:"
          cat current_running.txt

      - name: Delete all non-running workflow runs
        run: |
          while IFS= read -r WORKFLOW_NAME; do
            echo "Processing workflow: $WORKFLOW_NAME"
            gh run list --repo "${{ github.repository }}" --workflow="$WORKFLOW_NAME" --limit 100 --json databaseId,status,conclusion \
              | jq -c '.[]' | while read -r run; do
                RUN_ID=$(echo "$run" | jq -r '.databaseId')
                STATUS=$(echo "$run" | jq -r '.status')
                CONCLUSION=$(echo "$run" | jq -r '.conclusion')

                # Skip currently running or queued runs
                if grep -qx "$RUN_ID" current_running.txt; then
                  echo "Skipping currently running run ID: $RUN_ID"
                  continue
                fi

                # Delete all completed runs regardless of outcome
                if [ "$STATUS" = "completed" ]; then
                  echo "Deleting completed run ID ($CONCLUSION): $RUN_ID"
                  echo y | gh run delete "$RUN_ID" --repo "${{ github.repository }}"
                fi
              done
          done < workflows.txt
