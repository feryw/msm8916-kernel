name: Release deb packages kernel via docker 
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit or tag to build'
        required: true
        default: 'v6.12.41-wyref'
      arch:
        description: "Target architecture"
        required: true
        default: 'armv7'
        type: choice
        options:
          - armv8
          - armv7
      gcc:
        description: "GCC Version"
        required: true
        default: 'gcc10'
        type: choice
        options:
          - gcc5
          - gcc6
          - gcc7
          - gcc8
          - gcc9
          - gcc10
          
jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-latest   # host runner is x86_64
    container:
      image: arm64v8/ubuntu:20.04   # Ubuntu 20.04 ARM64 rootfs
      options: --privileged         # required for qemu-user-static + chroot bind mounts
    steps:
      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Prepare & Install dependencies
        id: stripver
        run: |
          TAG="${{ inputs.commit }}"
          VERSION="${TAG#v}"
          VER="${VERSION%-*}"
          echo "VER=$VER" >> "$GITHUB_OUTPUT"

          dpkg --add-architecture armhf
          apt-get -y update
          DEBIAN_FRONTEND=noninteractive apt-get -y install apt-utils
          DEBIAN_FRONTEND=noninteractive apt-get -y install \
            libc6-dev perl gnupg gcc-5 gcc-6 gcc-7 gcc-8 gcc-9 gcc-10 \
            gcc-5-arm-linux-gnueabihf gcc-6-arm-linux-gnueabihf gcc-7-arm-linux-gnueabihf \
            gcc-8-arm-linux-gnueabihf gcc-9-arm-linux-gnueabihf gcc-10-arm-linux-gnueabihf \
            libssl-dev:armhf libelf-dev debhelper patchutils lzop \
            liblz4-tool ccache build-essential qemu-user-static curl

          curl -sSL https://kartolo.sby.datautama.net.id/ubuntu/pool/universe/a/android-platform-tools/mkbootimg_34.0.5-12_all.deb \
            -o /tmp/mkbootimg.deb && dpkg -i /tmp/mkbootimg.deb
          ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          echo wyref > /etc/hostname

      - name: Checkout HEAD Kernel Source
        uses: actions/checkout@v4

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ inputs.gcc }}-${{ inputs.commit }}
          restore-keys: |
            ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ inputs.gcc }}-${{ inputs.commit }}-
            ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ inputs.gcc }}-

      - name: Build kernel
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          make LOCALVERSION= mrproper
          if [ "${{ inputs.arch }}" = "armv8" ]; then
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-5 40
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-6 50
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-7 60
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 70
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 80
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 90
            if [ "${{ inputs.gcc }}" = "gcc5" ]; then
              update-alternatives --set gcc /usr/bin/gcc-5
            elif [ "${{ inputs.gcc }}" = "gcc6" ]; then
              update-alternatives --set gcc /usr/bin/gcc-6
            elif [ "${{ inputs.gcc }}" = "gcc7" ]; then
              update-alternatives --set gcc /usr/bin/gcc-7
            elif [ "${{ inputs.gcc }}" = "gcc8" ]; then
              update-alternatives --set gcc /usr/bin/gcc-8
            elif [ "${{ inputs.gcc }}" = "gcc9" ]; then
              update-alternatives --set gcc /usr/bin/gcc-9
            else
              update-alternatives --set gcc /usr/bin/gcc-10
            fi  
            make CC='ccache gcc' LOCALVERSION= uz801v3_defconfig
            make CC='ccache gcc' LOCALVERSION= bindeb-pkg -j$(nproc) && \
            make CC='ccache gcc' LOCALVERSION= bindeb-pkg -j$(nproc)
          else
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-5 40
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-6 50
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-7 60
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-8 70
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-9 80
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-10 90
            if [ "${{ inputs.gcc }}" = "gcc5" ]; then
              update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-5
            elif [ "${{ inputs.gcc }}" = "gcc6" ]; then
              update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-6
            elif [ "${{ inputs.gcc }}" = "gcc7" ]; then
              update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-7
            elif [ "${{ inputs.gcc }}" = "gcc8" ]; then
              update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-8
            elif [ "${{ inputs.gcc }}" = "gcc9" ]; then
              update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-9
            else
              update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-10
            fi
            make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- LOCALVERSION= uz801v3_defconfig
            DEB_BUILD_OPTIONS=compress=gzip KBUILD_DEBARCH=armhf make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
              CC='ccache arm-linux-gnueabihf-gcc' LOCALVERSION= -j$(nproc) bindeb-pkg && rm -f ../*${{ steps.stripver.outputs.VER }}* && \
            DEB_BUILD_OPTIONS=compress=gzip KBUILD_DEBARCH=armhf make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
              CC='ccache arm-linux-gnueabihf-gcc' LOCALVERSION= -j$(nproc) bindeb-pkg     
          fi
          mkdir -p artifacts
          if ! find .. -maxdepth 1 -name "linux-*${{ steps.stripver.outputs.VER }}*.deb" -exec mv {} artifacts/ \; ;then
            echo "No matching .deb files found for version ${{ steps.stripver.outputs.VER }}"
            exit 1
          fi

      - name: Make boot image
        run: |
          # same content as before …
          echo "Making boot image"
          # (your existing script body is kept unchanged)

      - name: Generate release tag
        id: tagver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="feryw/msm8916-kernel"
          TAG_NAME=$(echo ${{ inputs.commit }}-${{ inputs.gcc }}-${{ inputs.arch }})
          if gh release view "$TAG_NAME" --repo "$REPO" > /dev/null 2>&1; then
            gh release delete "$TAG_NAME" --repo "$REPO" --yes || true
          fi
          if gh api "repos/$REPO/git/ref/tags/$TAG_NAME" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG_NAME" || true
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagver.outputs.TAG_NAME }}
          files: artifacts/*
