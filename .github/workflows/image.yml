name: Release deb packages kernel (old)
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit or tag to build'
        required: true
        default: 'v6.12.41-wyref'
      arch:
        description: "Target architecture"
        required: true
        default: 'armv7'
        type: choice
        options:
          - armv8
          - armv7
      gcc:
        description: "GCC Version"
        required: true
        default: 'gcc7'
        type: choice
        options:
          - gcc7
          - gcc8
          
jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04  # ✅ use normal x86_64 runner
    steps:
      - name: Checkout HEAD Kernel Source
        uses: actions/checkout@v4

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ inputs.gcc }}-${{ inputs.commit }}
          restore-keys: |
            ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ inputs.gcc }}-${{ inputs.commit }}-
            ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ inputs.gcc }}-

      - name: Build kernel inside aarch64 container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu18.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential gcc-7 gcc-8 \
              gcc-7-arm-linux-gnueabihf gcc-8-arm-linux-gnueabihf \
              libc6-dev perl gnupg libssl-dev:armhf libelf-dev \
              debhelper patchutils lzop liblz4-tool ccache \
              qemu-user-static flex bison texinfo
          run: |
            set -e
            export USE_CCACHE=1
            export CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache
            export PATH="/usr/lib/ccache:$PATH"

            TAG="${{ inputs.commit }}"
            VERSION="${TAG#v}"
            VER="${VERSION%-*}"

            make LOCALVERSION= mrproper
            if [ "${{ inputs.arch }}" = "armv8" ]; then
              update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-7 80
              update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 90
              if [ "${{ inputs.gcc }}" = "gcc7" ]; then
                update-alternatives --set gcc /usr/bin/gcc-7
              else
                update-alternatives --set gcc /usr/bin/gcc-8
              fi
              make CC='ccache gcc' LOCALVERSION= uz801v3_defconfig
              make CC='ccache gcc' LOCALVERSION= bindeb-pkg -j$(nproc)
            else
              update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-7 80
              update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-8 90
              if [ "${{ inputs.gcc }}" = "gcc7" ]; then
                update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-7
              else
                update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-8
              fi
              make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- LOCALVERSION= uz801v3_defconfig
              DEB_BUILD_OPTIONS=compress=gzip KBUILD_DEBARCH=armhf make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
                CC='ccache arm-linux-gnueabihf-gcc' LOCALVERSION= -j$(nproc) bindeb-pkg
            fi

            mkdir -p artifacts
            find .. -maxdepth 1 -name "linux-*${VER}*.deb" -exec mv {} artifacts/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debs
          path: artifacts/*
