name: Kernel ARMv7 Native Build

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Enable QEMU for ARM (via binfmt)
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install all

      - name: Run ARMv7 container and build kernel
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/kernel \
            -w /kernel \
            arm32v7/debian:bullseye \
            bash -c "
              apt update &&
              apt install -y build-essential bc kmod cpio flex bison \
                libncurses-dev libelf-dev libssl-dev dwarves fakeroot \
                rsync xz-utils ccache lzop liblz4-tool gcc gcc-9 debhelper
              update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
              update-alternatives --set gcc /usr/bin/gcc-9
              make LOCALVERSION= mrproper
              make ARCH=arm LOCALVERSION= uz801v3_defconfig &&
              make -j$(nproc) ARCH=arm LOCALVERSION= bindeb-pkg
            "

      - name: List kernel DEBs
        run: ls -lh ../*.deb || true
