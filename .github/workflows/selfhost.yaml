name: Self-hosted deb packages kernel (old)
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit or tag to build'
        required: true
        default: 'v6.12.43-wyref'
      arch:
        description: "Target architecture"
        required: true
        default: 'armv7'
        type: choice
        options:
          - armv7
      gcc:
        description: "GCC Version"
        required: true
        default: 'gcc7'
        type: choice
        options:
          - gcc6
          - gcc7
          - gcc8
          
jobs:
  build:
    name: Build kernel
    runs-on: self-hosted
    steps:
      - name: Checkout HEAD Kernel Source
        uses: actions/checkout@v4

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"
     
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ inputs.gcc }}-${{ inputs.commit }}
          restore-keys: |
            ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ inputs.gcc }}-${{ inputs.commit }}-
            ${{ runner.os }}-kernel-build-${{ inputs.arch }}-${{ inputs.gcc }}-

      - name: Build kernel inside aarch64 container
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu18.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          dockerRunArgs: |
            --platform linux/arm64
            --hostname ryzen5-7600builder
            --volume "${GITHUB_WORKSPACE}/artifacts:/artifacts"
            --volume "${GITHUB_WORKSPACE}/.ccache:/ccache"
          install: |
            dpkg --add-architecture armhf
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential bc cpio kmod rsync libc6-dev perl gcc gcc-6 gcc-8 \
              gnupg libssl-dev libssl-dev:armhf libelf-dev lsb-release debhelper \
              patchutils lzop liblz4-tool ccache flex bison texinfo \
              gcc-arm-linux-gnueabihf gcc-6-arm-linux-gnueabihf gcc-8-arm-linux-gnueabihf
            DEBIAN_FRONTEND=noninteractive apt-get install -y -t bionic-backports debhelper
          run: |
            set -e
            export USE_CCACHE=1
            export CCACHE_DIR=/ccache
            export PATH="/usr/lib/ccache:$PATH"

            TAG="${{ inputs.commit }}"
            VERSION="${TAG#v}"
            VER="${VERSION%-*}"
            
            make LOCALVERSION= mrproper
            
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-6 70
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-7 80
            update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-8 90
            #update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-6 70
            #update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-7 80
            #update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 90
            
            if [ "${{ inputs.gcc }}" = "gcc6" ]; then
              update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-6
            elif [ "${{ inputs.gcc }}" = "gcc7" ]; then
              update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-7
            else
              update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-8
            fi

            #if [ "${{ inputs.gcc }}" = "gcc6" ]; then
            #  update-alternatives --set gcc /usr/bin/gcc-6
            #elif [ "${{ inputs.gcc }}" = "gcc7" ]; then
            #  update-alternatives --set gcc /usr/bin/gcc-7
            #else
            #  update-alternatives --set gcc /usr/bin/gcc-8
            #fi

            export DH_COMPAT=13
            make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- LOCALVERSION= uz801v3_defconfig
            DEB_BUILD_OPTIONS=compress=gzip KBUILD_DEBARCH=armhf DH_COMPAT=13 make -j$(nproc) \
              ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
              CC='ccache arm-linux-gnueabihf-gcc' LOCALVERSION="" \
              bindeb-pkg 
              #&& rm -f ../*${VER}* && \
              #DEB_BUILD_OPTIONS=compress=gzip KBUILD_DEBARCH=armhf DH_COMPAT=13 make -j$(nproc) \
              ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- CC='ccache arm-linux-gnueabihf-gcc' LOCALVERSION="" \
              #bindeb-pkg

            #make LOCALVERSION= uz801v3_defconfig
            #DEB_BUILD_OPTIONS=compress=gzip make CC='ccache gcc' LOCALVERSION= \
              #-j$(nproc) bindeb-pkg && rm -f ../*${VER}* && \
              #DEB_BUILD_OPTIONS=compress=gzip make CC='ccache gcc' LOCALVERSION= \
              #-j$(nproc) bindeb-pkg

            chown -R 1001:1001 /ccache ../
            find .. -maxdepth 1 -name "linux-*${VER}*.deb" -exec mv {} artifacts/ \;
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debs
          path: artifacts/*

  bootimg:
    name: Generate boot image
    runs-on: self-hosted
    steps:
      - name: Make boot image
        run: |
          sudo apt-get -y update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install apt-utils -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install qemu-user-static -y
          
          curl -sSL \
            https://kartolo.sby.datautama.net.id/ubuntu/pool/universe/a/android-platform-tools/mkbootimg_34.0.5-12_all.deb | \
            tee /tmp/mkbootimg.deb > /dev/null
          DEBIAN_FRONTEND=noninteractive sudo apt install /tmp/mkbootimg.deb
          
          if [ "${{ inputs.arch }}" = "armv7" ]; then
            DISTRO_ARCH="armhf"
            DTB_DIR="usr/lib"
          else
            DISTRO_ARCH="arm64"
            DTB_DIR="usr/lib/linux-image*/qcom"
          fi
          
          DOWNLOAD_SERVER="images.linuxcontainers.org"
          DOWNLOAD_INDEX_PATH="/meta/1.0/index-system"
          DOWNLOAD_DISTRO="ubuntu;jammy;${DISTRO_ARCH};default"

          DTB_FILE="msm8916-yiming-uz801v3.dtb"
          RAMDISK_FILE="initrd.img"
          ROOTFS_DIR="rootfs-$DISTRO_ARCH"
          PARTUUID="a7ab80e8-e9d1-e8cd-f157-93f69b1d141e"

          mkdir -p "$ROOTFS_DIR"
          ROOTFS_URL="https://$DOWNLOAD_SERVER$(curl -fsSL "https://$DOWNLOAD_SERVER$DOWNLOAD_INDEX_PATH" | grep "$DOWNLOAD_DISTRO" | cut -f6 -d';')rootfs.tar.xz"
          curl -L -o rootfs.tar.xz "$ROOTFS_URL"
          tar -xf rootfs.tar.xz -C "$ROOTFS_DIR"
          chmod 1777 "$ROOTFS_DIR/tmp"
          rm rootfs.tar.xz

          cat <<EOF | tee "$ROOTFS_DIR/tmp/chroot.sh" > /dev/null
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive

          cat <<EOI > /etc/fstab
          PARTUUID=$PARTUUID / ext4 defaults,noatime,commit=600,errors=remount-ro 0 1
          tmpfs /tmp tmpfs defaults,nosuid 0 0
          EOI

          rm /etc/resolv.conf 
          echo "nameserver 8.8.8.8" > /etc/resolv.conf

          apt-get update
          apt-get install -y apt-utils
          apt-get install -y wireless-regdb initramfs-tools
          dpkg -i /tmp/linux-image-*.deb || apt-get install -f -y
          EOF

          chmod 755 "$ROOTFS_DIR/tmp/chroot.sh"
          cp artifacts/linux-image-*.deb $ROOTFS_DIR/tmp/

          sudo mount --bind /proc "$ROOTFS_DIR/proc"
          sudo mount --bind /dev "$ROOTFS_DIR/dev"
          sudo mount --bind /dev/pts "$ROOTFS_DIR/dev/pts"
          sudo mount --bind /sys "$ROOTFS_DIR/sys"
          LANG=C LANGUAGE=C LC_ALL=C sudo chroot "$ROOTFS_DIR" /tmp/chroot.sh
          sudo umount "$ROOTFS_DIR/proc"
          sudo umount "$ROOTFS_DIR/dev/pts"
          sudo umount "$ROOTFS_DIR/dev"
          sudo umount "$ROOTFS_DIR/sys"

          KERNEL_IMG=$(find "$ROOTFS_DIR/boot" -name "vmlinuz*" | head -n1)
          INITRD_IMG=$(find "$ROOTFS_DIR/boot" -name "initrd.img*" | head -n1)
          DTB_PATH=$(find "$ROOTFS_DIR/$DTB_DIR" -name "*uz801v3.dtb" | head -n1)
          cp "$KERNEL_IMG" Image.gz
          cp "$INITRD_IMG" initrd.img
          cp "$DTB_PATH" "$DTB_FILE"

          cat Image.gz $DTB_FILE > kernel-dtb
          mkbootimg \
          --base 0x80000000 \
          --kernel_offset 0x00080000 \
          --ramdisk_offset 0x02000000 \
          --tags_offset 0x01e00000 \
          --pagesize 2048 \
          --second_offset 0x00f00000 \
          --ramdisk "$RAMDISK_FILE" \
          --cmdline "earlycon root=PARTUUID=$PARTUUID console=ttyMSM0,115200" \
          --kernel kernel-dtb -o boot.img
          mv boot.img artifacts/boot-${{ inputs.commit }}_${{ inputs.gcc }}_${{ inputs.arch }}.img
  
      - name: Generate release tag
        id: tagver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="feryw/msm8916-kernel"
          TAG_NAME=$(echo ${{ inputs.commit }}-${{ inputs.gcc }}-${{ inputs.arch }})
          if gh release view "$TAG_NAME" --repo "$REPO" > /dev/null 2>&1; then
            gh release delete "$TAG_NAME" --repo "$REPO" --yes || true
          fi
          if gh api "repos/$REPO/git/ref/tags/$TAG_NAME" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG_NAME" || true
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagver.outputs.TAG_NAME }}
          files: artifacts/*
